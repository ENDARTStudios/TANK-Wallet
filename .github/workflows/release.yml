name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.0.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-and-sign:
    name: Build, sign, and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate
        continue-on-error: true

      - name: Run all gates
        run: bun run verify

      - name: Build Docker image
        run: |
          docker build \
            --label org.opencontainers.image.source="${{ github.server_url }}/${{ github.repository }}" \
            --label org.opencontainers.image.version="${{ github.ref_name }}" \
            --label org.opencontainers.image.revision="${{ github.sha }}" \
            -t tank-wallet:${{ github.ref_name }} \
            -t ghcr.io/endart/tank-wallet:${{ github.ref_name }} \
            .

      - name: Install cosign (sigstore)
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"

      # ─── Keyless signing (sigstore OIDC) ──────────────────────────────
      - name: Sign Docker image (keyless via OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes ghcr.io/endart/tank-wallet:${{ github.ref_name }}

      # ─── Ed25519 signing (project key) ────────────────────────────────
      - name: Generate Ed25519 keypair (if not provided)
        if: env.RELEASE_SIGNING_KEY == ''
        run: |
          cosign generate-key-pair > /dev/null 2>&1 || true
          echo "No RELEASE_SIGNING_KEY secret set — using keyless only"
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}

      - name: Sign SBOM with Ed25519 key
        if: env.RELEASE_SIGNING_KEY != ''
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          COSIGN_PASSWORD: ${{ secrets.RELEASE_SIGNING_PASSWORD }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          # Generate SBOM
          bunx @cyclonedx/cyclonedx-npm --output-file reports/sbom.cyclonedx.json --output-format JSON

          # Sign SBOM with Ed25519 key
          echo "$COSIGN_PRIVATE_KEY" > /tmp/cosign.key
          cosign sign-blob \
            --key /tmp/cosign.key \
            --output-signature reports/sbom.cyclonedx.json.sig \
            --output-certificate reports/sbom.cyclonedx.json.pem \
            reports/sbom.cyclonedx.json
          shred -u /tmp/cosign.key

          # Verify signature
          cosign verify-blob \
            --key /tmp/cosign.pub \
            --signature reports/sbom.cyclonedx.json.sig \
            reports/sbom.cyclonedx.json || echo "Verify skipped (no public key)"

      - name: Generate SBOM (keyless fallback)
        if: env.RELEASE_SIGNING_KEY == ''
        run: |
          bunx @cyclonedx/cyclonedx-npm --output-file reports/sbom.cyclonedx.json --output-format JSON
          cosign sign-blob --yes \
            --output-certificate reports/sbom.cyclonedx.json.pem \
            --output-signature reports/sbom.cyclonedx.json.sig \
            reports/sbom.cyclonedx.json
        env:
          COSIGN_EXPERIMENTAL: "1"
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}

      - name: Generate build attestation
        run: |
          cat > reports/build-attestation.md << 'EOF'
          # Build Attestation

          - **Version**: ${{ github.ref_name }}
          - **Commit**: ${{ github.sha }}
          - **Build time**: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - **Builder**: github-actions
          - **Signed by**: sigstore/cosign (keyless OIDC + Ed25519 project key)
          - **SBOM**: reports/sbom.cyclonedx.json
          - **SBOM signature**: reports/sbom.cyclonedx.json.sig
          - **Docker image**: ghcr.io/endart/tank-wallet:${{ github.ref_name }}
          EOF
          docker image inspect tank-wallet:${{ github.ref_name }} --format='{{json .RootFS.Layers}}' > reports/image-layers.json

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name == 'push'
        run: docker push ghcr.io/endart/tank-wallet:${{ github.ref_name }}

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            reports/sbom.cyclonedx.json
            reports/sbom.cyclonedx.json.pem
            reports/sbom.cyclonedx.json.sig
            reports/build-attestation.md
            reports/image-layers.json
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            reports/
            Dockerfile
          retention-days: 90
