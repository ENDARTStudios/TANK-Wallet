name: COSIGN Image Signing

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  cosign:
    name: cosign sign
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/tank-wallet:${{ github.ref_name }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
      - name: cosign keyless sign
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/tank-wallet:${{ github.ref_name }}
          cosign sign --yes "$IMAGE"
      - name: Verify signature
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/tank-wallet:${{ github.ref_name }}
          cosign verify --certificate-identity-regexp "https://github.com/${{ github.repository_owner }}" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$IMAGE"
