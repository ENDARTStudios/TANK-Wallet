name: SBOM CycloneDX

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  sbom:
    name: Generate SBOM (CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Generate CycloneDX SBOM
        run: |
          bunx @cyclonedx/cyclonedx-npm --output-file reports/sbom.cyclonedx.json --output-format JSON --spec-version 1.5
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: reports/sbom.cyclonedx.json
          retention-days: 90
      - name: Attach to GHCR release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/tank-wallet:${{ github.ref_name }}
          echo "SBOM attached to $IMAGE"
