name: dast-zap-baseline

# DAST local-first (T090). NÃO-required: nunca bloqueia PRs.
# Alvo SEMPRE local (app + ZAP no mesmo runner). PROIBIDO produção/previews.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  zap-baseline-local:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Start app (dev, background)
        run: |
          (bun run dev > dev.log 2>&1 &)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ > /dev/null; then echo "app up"; break; fi
            sleep 10
          done
          curl -sf http://localhost:3000/ > /dev/null

      - name: ZAP baseline (Automation Framework, local only)
        run: |
          mkdir -p zap-out
          chmod 777 zap-out
          docker run --rm --network="host" \
            -v "${{ github.workspace }}/dast-config:/zap/wrk:ro" \
            -v "${{ github.workspace }}/zap-out:/zap/out" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap.sh -cmd -autorun /zap/wrk/zap-baseline.yaml

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-baseline-report
          path: zap-out/
          retention-days: 30

      - name: Alert counts by risk
        if: always()
        run: |
          python3 - <<'EOF'
          import json
          with open("zap-out/zap-report.json") as f:
              data = json.load(f)
          counts = {}
          for site in data.get("site", []):
              for alert in site.get("alerts", []):
                  r = alert.get("riskdesc", "unknown").split(" ")[0]
                  counts[r] = counts.get(r, 0) + 1
          print("ZAP alerts by risk:", counts)
          EOF
